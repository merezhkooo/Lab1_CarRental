
project: "Інформаційна система прокату автомобілів"

system_request:
  sponsor: "Керівник компанії з прокату автомобілів"
  business_need: >
    Автоматизація процесів бронювання автомобілів, оформлення їх видачі
    та повернення, ведення обліку автопарку й управління тарифними планами.
  business_requirements:
    - "Перегляд доступних автомобілів та їхніх характеристик."
    - "Бронювання автомобілів на вибрані дати."
    - "Перевірка доступності автомобілів з урахуванням наявних бронювань."
    - "Оформлення видачі та повернення автомобілів."
    - "Автоматичний розрахунок вартості оренди."
    - "Управління автопарком і тарифними планами."
    - "Розмежування доступу відповідно до ролей користувачів."
  business_value:
    - >
      Ціль — скоротити середній час оформлення бронювання щонайменше
      на 30% порівняно з поточним процесом. Результат необхідно перевірити
      вимірюванням часу до та після впровадження системи.
    - "Зменшити ризик подвійного бронювання автомобілів."
    - "Зменшити кількість помилок під час обліку автомобілів і розрахунку оренди."
  constraints:
    - "Використовувати Python версії 3.10 або новішої."
    - "Зберігати специфікацію вимог у форматі YAML."
    - "Для роботи з YAML використовувати бібліотеку PyYAML."
    - "Для автоматизованого тестування використовувати pytest."
    - "Для контролю версій використовувати Git."

stakeholders:
  - role: "Клієнт"
    description: "Вибирає автомобіль, переглядає його характеристики та бронює на потрібні дати."
  - role: "Менеджер"
    description: "Оформлює бронювання, видачу й повернення автомобілів та фіксує їхній стан."
  - role: "Адміністратор"
    description: "Керує інформацією про автопарк і тарифними планами."

user_stories:
  - id: "US-01"
    text: "Як клієнт, я хочу бронювати доступний автомобіль на вибрані дати, щоб отримати його в потрібний період."
  - id: "US-02"
    text: "Як клієнт, я хочу переглядати доступні автомобілі, їхні характеристики та вартість оренди, щоб вибрати автомобіль відповідно до своїх потреб і бюджету."
  - id: "US-03"
    text: "Як клієнт, я хочу переглядати інформацію про своє бронювання, щоб перевіряти дати оренди, вибраний автомобіль і вартість."
  - id: "US-04"
    text: "Як менеджер, я хочу реєструвати видачу автомобіля та його початковий стан, щоб вести облік передачі транспортного засобу."
  - id: "US-05"
    text: "Як менеджер, я хочу реєструвати повернення автомобіля, фактичну дату та його стан, щоб завершувати оренду й визначати остаточну вартість."
  - id: "US-06"
    text: "Як менеджер, я хочу переглядати бронювання з датами та даними автомобілів, щоб планувати видачу й запобігати подвійним бронюванням."
  - id: "US-07"
    text: "Як адміністратор, я хочу додавати автомобілі та редагувати їхні характеристики, щоб підтримувати актуальну інформацію про автопарк."
  - id: "US-08"
    text: "Як адміністратор, я хочу створювати й редагувати тарифні плани, щоб визначати актуальні умови прокату."

requirements:
  - id: "R1"
    type: "functional"
    text: "ІС повинна надавати користувачу список автомобілів із зазначенням марки, моделі та основних характеристик."
    priority: 2
    source: "User Story US-02"

  - id: "R2"
    type: "functional"
    text: "ІС повинна надавати можливість перевіряти доступність автомобілів на заданий період."
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "R3"
    type: "functional"
    text: "ІС повинна забезпечувати створення бронювання автомобіля клієнтом."
    priority: 1
    source: "User Story US-01"

  - id: "R3.1"
    parent: "R3"
    type: "functional"
    text: >
      ІС повинна зберігати вибраний автомобіль, дату початку та дату
      завершення оренди для кожного бронювання.
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "R3.2"
    parent: "R3"
    type: "functional"
    text: >
      ІС повинна відхиляти бронювання, якщо автомобіль уже заброньований
      на період, що перетинається з вибраним періодом.
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "R4"
    type: "functional"
    text: "ІС повинна надавати клієнту можливість переглядати інформацію про створене бронювання."
    priority: 2
    source: "User Story US-03"

  - id: "R5"
    type: "functional"
    text: "ІС повинна забезпечувати реєстрацію видачі автомобіля клієнту менеджером."
    priority: 1
    source: "User Story US-04"

  - id: "R5.1"
    parent: "R5"
    type: "functional"
    text: "ІС повинна зберігати дату видачі автомобіля та зафіксований менеджером початковий стан."
    priority: 1
    source: "User Story US-04"

  - id: "R6"
    type: "functional"
    text: "ІС повинна забезпечувати реєстрацію повернення автомобіля менеджером."
    priority: 1
    source: "User Story US-05"

  - id: "R7"
    type: "functional"
    text: "ІС повинна зберігати фактичну дату повернення автомобіля та інформацію про його стан."
    priority: 1
    source: "User Story US-05"

  - id: "R8"
    type: "functional"
    text: "ІС повинна автоматично розраховувати вартість оренди відповідно до тарифу й тривалості користування автомобілем."
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "R9"
    type: "functional"
    text: "ІС повинна надавати адміністратору можливість додавати автомобілі до автопарку."
    priority: 2
    source: "User Story US-07"

  - id: "R10"
    type: "functional"
    text: "ІС повинна надавати адміністратору можливість редагувати характеристики автомобілів."
    priority: 2
    source: "User Story US-07"

  - id: "R11"
    type: "functional"
    text: "ІС повинна надавати адміністратору можливість створювати тарифні плани."
    priority: 2
    source: "User Story US-08"

  - id: "R12"
    type: "functional"
    text: "ІС повинна надавати адміністратору можливість змінювати параметри та вартість тарифних планів."
    priority: 2
    source: "User Story US-08"

  - id: "R13"
    type: "functional"
    text: "ІС повинна надавати менеджеру список бронювань із датами оренди та інформацією про автомобілі."
    priority: 2
    source: "User Story US-06"

  - id: "R14"
    type: "functional"
    text: "ІС повинна розмежовувати доступ до функцій відповідно до ролі користувача."
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "N1"
    type: "operational"
    text: "ІС повинна підтримувати запуск у середовищі Windows із використанням Python версії 3.10 або новішої."
    priority: 3
    source: "Документ: методичні рекомендації до лабораторної роботи"

  - id: "N2"
    type: "performance"
    text: "ІС повинна відображати результати пошуку автомобілів не довше ніж за 2 секунди за умови одночасної роботи до 50 користувачів."
    priority: 3
    source: "Проєктний критерій продуктивності; потребує погодження із замовником"

  - id: "N3"
    type: "security"
    text: "ІС повинна дозволяти керування автопарком і тарифами лише користувачам із роллю адміністратора."
    priority: 1
    source: "Інтерв'ю з представником компанії"

  - id: "N4"
    type: "cultural"
    text: "ІС повинна відображати користувацький інтерфейс українською мовою."
    priority: 4
    source: "Проєктне припущення; потребує погодження із замовником"

  - id: "C1"
    type: "constraint"
    text: "Проєкт повинен використовувати Python версії 3.10 або новішої та бібліотеки PyYAML і pytest відповідно до методичних рекомендацій."
    source: "Документ: методичні рекомендації до лабораторної роботи"
